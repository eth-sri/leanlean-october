name = "PottsDiscontinuity"
version = "1.0.0"
defaultTargets = ["PottsDiscontinuity", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "PottsDiscontinuity"
globs = ["PottsDiscontinuity.+"]

# Statement surface (Mathlib only; proofs are deliberately `sorry`).
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

# Proved declarations; imports the proof development, never `Challenge`.
[[lean_lib]]
name = "Solution"
roots = ["Solution"]
